management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always

server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/healthflow
    username: postgres
    password: ${DB_PASSWORD}
  main:
    lazy-initialization: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 50
    open-in-view: false