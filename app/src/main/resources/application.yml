management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always

server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/healthflow
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      default_batch_fetch_size: 50 # bunu user'ların eager yüklenmesinden ötürü oluşabilecek n+1 probleminin ortadan kalkması için kullandık.
      ddl-auto: create

