management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always

server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgres://localhost:5432/healthflow
    username: postgres
    password: 123
  jpa:
    open-in-view: false
    hibernate:
      default_batch_fetch_size: 50 # bunu user'ların eager yüklenmesinden ötürü oluşabilecek n+1 probleminin ortadan kalkması için kullandık.

