management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always

server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/healthflow
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 50 # bunu user'ların eager yüklenmesinden ötürü oluşabilecek n+1 probleminin ortadan kalkması için kullandık.
        format_sql: true
  data:
    web:
      pageable:
        max-page-size: 100

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
